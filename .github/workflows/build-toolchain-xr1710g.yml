name: Build OpenWrt XR1710G Toolchain

on:
  schedule:
    - cron: "47 18 * * 0"
  repository_dispatch:
    types:
      - openwrt-updated
  push:
    branches:
      - main
    paths:
      - .github/actions/prepare-xr1710g-source/action.yml
      - .github/workflows/build-openwrt-xr1710g.yml
      - .github/workflows/build-packages-xr1710g.yml
      - .github/workflows/build-toolchain-xr1710g.yml
      - patches/**
      - scripts/**
      - README.md
  workflow_dispatch:
    inputs:
      openwrt_repo:
        description: OpenWrt/ImmortalWrt source repository
        required: true
        default: https://github.com/immortalwrt/immortalwrt.git
      openwrt_ref:
        description: OpenWrt branch, tag, or commit
        required: true
        default: master
      integration_repo:
        description: XR1710G integration source repository
        required: true
        default: https://github.com/YYH2913/openwrt.git
      integration_ref:
        description: XR1710G integration branch, tag, or commit ("none" skips the merge)
        required: true
        default: xr1710g-6.18-integration
      target_profile:
        description: OpenWrt device profile
        required: true
        default: econet_xr1710g-ubi
      extra_config:
        description: Extra OpenWrt .config lines, one per line
        required: false
        default: ""
      create_release:
        description: Publish toolchain archive as a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: openwrt-xr1710g-toolchain
  cancel-in-progress: false

env:
  SOURCE_DIR: openwrt
  TARGET: airoha
  SUBTARGET: an7581
  OPENWRT_REPO: ${{ inputs.openwrt_repo || github.event.client_payload.openwrt_repo || 'https://github.com/immortalwrt/immortalwrt.git' }}
  OPENWRT_REF: ${{ inputs.openwrt_ref || github.event.client_payload.openwrt_ref || 'master' }}
  INTEGRATION_REPO: ${{ inputs.integration_repo || github.event.client_payload.integration_repo || 'https://github.com/YYH2913/openwrt.git' }}
  INTEGRATION_REF: ${{ inputs.integration_ref || github.event.client_payload.integration_ref || 'xr1710g-6.18-integration' }}
  TARGET_PROFILE: ${{ inputs.target_profile || github.event.client_payload.target_profile || 'econet_xr1710g-ubi' }}
  EXTRA_CONFIG: ${{ inputs.extra_config || github.event.client_payload.extra_config || '' }}
  CREATE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.create_release) || github.event_name == 'repository_dispatch' && format('{0}', github.event.client_payload.create_release) || 'true' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  DOWNLOAD_CACHE_VERSION: v2
  TOOLCHAIN_CACHE_VERSION: v2

jobs:
  toolchain:
    name: Toolchain ${{ inputs.target_profile || 'econet_xr1710g-ubi' }} @ ${{ inputs.openwrt_ref || 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -eux
          timeout 180s sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          timeout 60s docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          set -eux
          sudo find /etc/apt/sources.list.d -type f \
            \( -iname '*azure*' -o -iname '*microsoft*' \) \
            -print -exec sudo sed -i 's/^[[:space:]]*deb /# disabled for OpenWrt build: deb /' {} \;
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ccache libelf-dev device-tree-compiler \
            python3-ply python3-pyelftools qemu-utils zstd

      - name: Resolve OpenWrt commit
        id: source
        run: |
          set -eux
          mkdir -p source-probe
          git -C source-probe init
          git -C source-probe remote add origin "${OPENWRT_REPO}"
          git -C source-probe fetch --depth 1 origin "${OPENWRT_REF}"

          source_commit="$(git -C source-probe rev-parse FETCH_HEAD)"
          source_short="$(printf '%s' "${source_commit}" | cut -c1-12)"
          safe_ref="$(printf '%s' "${OPENWRT_REF}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')"
          cache_week="$(date -u +%G-W%V)"
          target_profile="${TARGET_PROFILE}"
          case "${target_profile}" in
            gemtek_xr1710g|gemtek_xr1710g-ubi|econet_xr1710g) target_profile="econet_xr1710g-ubi" ;;
          esac
          if [ -z "${safe_ref}" ]; then
            safe_ref="${source_short}"
          fi

          {
            printf 'source_commit=%s\n' "${source_commit}"
            printf 'source_short=%s\n' "${source_short}"
            printf 'safe_ref=%s\n' "${safe_ref}"
            printf 'cache_week=%s\n' "${cache_week}"
            printf 'target_profile=%s\n' "${target_profile}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare OpenWrt source with XR1710G integration
        id: prepare
        uses: ./.github/actions/prepare-xr1710g-source
        with:
          openwrt-repo: ${{ env.OPENWRT_REPO }}
          openwrt-ref: ${{ env.OPENWRT_REF }}
          openwrt-commit: ${{ steps.source.outputs.source_commit }}
          integration-repo: ${{ env.INTEGRATION_REPO }}
          integration-ref: ${{ env.INTEGRATION_REF }}
          source-dir: ${{ env.SOURCE_DIR }}

      - name: Restore downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOURCE_DIR }}/dl
            ${{ env.CCACHE_DIR }}
          key: xr1710g-downloads-${{ env.DOWNLOAD_CACHE_VERSION }}-${{ runner.os }}-${{ steps.source.outputs.safe_ref }}-toolchain-${{ hashFiles('.github/workflows/build-toolchain-xr1710g.yml', '.github/actions/prepare-xr1710g-source/action.yml') }}
          restore-keys: |
            xr1710g-downloads-${{ env.DOWNLOAD_CACHE_VERSION }}-${{ runner.os }}-${{ steps.source.outputs.safe_ref }}-
            xr1710g-downloads-${{ env.DOWNLOAD_CACHE_VERSION }}-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix libffi generated header lookup
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux
          libffi_makefile="feeds/packages/libs/libffi/Makefile"
          if [ -f "${libffi_makefile}" ]; then
            perl -0pi -e 's#^[ \t]*\$\(CP\)[ \t]*\\\n[ \t]*\$\(PKG_BUILD_DIR\)/\$\(GNU_TARGET_NAME\)\*/fficonfig\.h[ \t]*\\\n[ \t]*\$\(1\)/usr/include/#\tfind \$(PKG_BUILD_DIR) -name fficonfig.h -exec \$(CP) {} \$(1)/usr/include/ \\; -quit#ms; s#^[ \t]*\$\(CP\) .*/fficonfig\.h .*$#\tfind \$(PKG_BUILD_DIR) -name fficonfig.h -exec \$(CP) {} \$(1)/usr/include/ \\; -quit#m' "${libffi_makefile}"
            if grep -Fq '$(GNU_TARGET_NAME)*/fficonfig.h' "${libffi_makefile}"; then
              echo "libffi fficonfig.h lookup was not patched"
              sed -n '70,85p' "${libffi_makefile}"
              exit 1
            fi
            grep -n -A2 -B2 'fficonfig.h' "${libffi_makefile}"
          fi

      - name: Write toolchain build config
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux
          profile="${TARGET_PROFILE}"
          case "${profile}" in
            gemtek_xr1710g|gemtek_xr1710g-ubi|econet_xr1710g) profile="econet_xr1710g-ubi" ;;
          esac

          cat > .config <<EOF
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${profile}=y
          CONFIG_BUILDBOT=y
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          CONFIG_IB=y
          CONFIG_JSON_OVERVIEW_IMAGE_INFO=y
          CONFIG_KERNEL_BUILD_DOMAIN="github-actions"
          CONFIG_KERNEL_BUILD_USER="builder"
          CONFIG_MAKE_TOOLCHAIN=y
          CONFIG_SDK=y
          # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
          EOF

          if [ -n "${EXTRA_CONFIG}" ]; then
            printf '%s\n' "${EXTRA_CONFIG}" >> .config
          fi

          grep -q "^CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${profile}=y$" .config
          make defconfig
          grep -q "^CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${profile}=y$" .config || {
            echo "Device profile was not accepted by OpenWrt Kconfig: ${profile}"
            grep "^CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_" .config || true
            exit 1
          }

      - name: Delete previous toolchain caches before rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN_CACHE_PREFIX: xr1710g-toolchain-${{ env.TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ steps.source.outputs.safe_ref }}-${{ steps.source.outputs.source_short }}-${{ steps.source.outputs.target_profile }}-
        run: |
          set -eux
          mapfile -t cache_keys < <(gh cache list --limit 100 --json key --jq '.[].key' | grep -F "${TOOLCHAIN_CACHE_PREFIX}" || true)
          for cache_key in "${cache_keys[@]}"; do
            case "${cache_key}" in
              "${TOOLCHAIN_CACHE_PREFIX}"*) gh cache delete "${cache_key}" || true ;;
            esac
          done

      - name: Restore weekly toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOURCE_DIR }}/staging_dir/host
            ${{ env.SOURCE_DIR }}/staging_dir/hostpkg
            ${{ env.SOURCE_DIR }}/staging_dir/toolchain-*
            ${{ env.SOURCE_DIR }}/build_dir/toolchain-*
          key: xr1710g-toolchain-${{ env.TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ steps.source.outputs.safe_ref }}-${{ steps.source.outputs.source_short }}-${{ steps.source.outputs.target_profile }}-${{ steps.source.outputs.cache_week }}
          restore-keys: |
            xr1710g-toolchain-${{ env.TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ steps.source.outputs.safe_ref }}-${{ steps.source.outputs.source_short }}-${{ steps.source.outputs.target_profile }}-

      - name: Compile tools and toolchain
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -o pipefail
          nproc
          make -j"$(nproc)" tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Collect toolchain archive
        id: collect
        run: |
          set -eux
          outdir="artifacts/toolchain"
          archive="openwrt-xr1710g-toolchain-${TOOLCHAIN_CACHE_VERSION}-${{ steps.source.outputs.target_profile }}-${{ steps.source.outputs.source_short }}-${{ steps.source.outputs.cache_week }}.tar.zst"
          mkdir -p "${outdir}"
          cp -a "${SOURCE_DIR}/.config" "${outdir}/openwrt-xr1710g-toolchain.config"

          tar_paths=()
          for pattern in \
            staging_dir/host \
            staging_dir/hostpkg \
            staging_dir/toolchain-* \
            build_dir/toolchain-*; do
            while IFS= read -r matched; do
              tar_paths+=("${matched#${SOURCE_DIR}/}")
            done < <(compgen -G "${SOURCE_DIR}/${pattern}" || true)
          done

          if [ "${#tar_paths[@]}" -eq 0 ]; then
            echo "No toolchain paths were found to archive."
            exit 1
          fi

          (cd "${SOURCE_DIR}" && tar -I 'zstd -T0 -19' -cf "${GITHUB_WORKSPACE}/${outdir}/${archive}" "${tar_paths[@]}")

          {
            echo "OpenWrt repo: ${OPENWRT_REPO}"
            echo "OpenWrt ref: ${OPENWRT_REF}"
            echo "OpenWrt commit: ${{ steps.source.outputs.source_commit }}"
            if [ -n "${{ steps.prepare.outputs.integration_commit }}" ]; then
              echo "Integration repo: ${INTEGRATION_REPO}"
              echo "Integration ref: ${INTEGRATION_REF}"
              echo "Integration commit: ${{ steps.prepare.outputs.integration_commit }}"
            fi
            echo "Target: ${TARGET}/${SUBTARGET}"
            echo "Profile: ${{ steps.source.outputs.target_profile }}"
            echo "Build type: toolchain"
            echo "Build time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')"
            echo
            echo "Restore this archive into the OpenWrt source root before running a firmware build."
          } > "${outdir}/BUILDINFO-toolchain.txt"

          (cd "${outdir}" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          find "${outdir}" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "artifact_dir=${outdir}" >> "$GITHUB_OUTPUT"

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xr1710g-toolchain-${{ github.run_number }}
          path: ${{ steps.collect.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ env.CREATE_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          build_time="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')"
          tag="xr1710g-toolchain-${TOOLCHAIN_CACHE_VERSION}-${{ steps.source.outputs.safe_ref }}-${{ steps.source.outputs.source_short }}-${{ steps.source.outputs.target_profile }}-${{ steps.source.outputs.cache_week }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "toolchain ${build_time}" \
              --notes-file artifacts/toolchain/BUILDINFO-toolchain.txt
            gh release upload "${tag}" artifacts/toolchain/* --clobber
          else
            gh release create "${tag}" artifacts/toolchain/* \
              --title "toolchain ${build_time}" \
              --notes-file artifacts/toolchain/BUILDINFO-toolchain.txt
          fi

      - name: Clean toolchain release staging files
        if: ${{ env.CREATE_RELEASE == 'true' }}
        run: |
          set -eux
          rm -rf artifacts/toolchain
